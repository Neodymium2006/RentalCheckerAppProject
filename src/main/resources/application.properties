spring.application.name=RentalCheckerAppProject

# Persist to a file on disk instead of Spring Boot's default anonymous
# in-memory H2 database (which is wiped every time the app stops).
spring.datasource.url=jdbc:h2:file:./data/rentaldb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# "update" keeps existing tables/rows and only applies new schema changes
# (like the new Unit.floor column) — it will NOT wipe your data on restart.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Optional: browse the file-based DB at http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:file:./data/rentaldb, user: sa, password: (blank)
spring.h2.console.enabled=true